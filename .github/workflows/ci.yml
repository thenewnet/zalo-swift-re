name: CI

on:
  push:
    branches: [main, ios-multi-account]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS build + tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
      - name: Build
        run: |
          set +e
          swift build > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -150
          tail -5 build.log
          exit $status
      - name: Test
        run: swift test 2>&1 | tail -60
